<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Student Task Manager</h1>
      <button id="themeToggle" class="btn secondary-btn">🌙 Dark Mode</button>
    </header>

    <!-- Stats Dashboard -->
    <section class="stats-card">
      <div class="stat-item">
        <span class="stat-number" id="totalTasks">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="completedTasks">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="pendingTasks">0</span>
        <span class="stat-label">Pending</span>
      </div>
    </section>

    <!-- Task Input Form -->
    <form id="taskForm" class="task-form">
      <div class="form-row">
        <input type="text" id="taskTitle" placeholder="Task description..." required />
        <select id="taskCategory" required>
          <option value="Homework">Homework</option>
          <option value="Assignment">Assignment</option>
          <option value="Exam">Exam</option>
          <option value="Personal">Personal</option>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="taskDueDate" required />
        <select id="taskPriority" required>
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>
        <button type="submit" class="btn primary-btn">+ Add Task</button>
      </div>
    </form>

    <!-- Search & Filter Controls -->
    <section class="controls-card">
      <input type="text" id="searchInput" placeholder="🔍 Search tasks by name..." />
      <div class="filter-group">
        <label>Status:</label>
        <select id="statusFilter">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Sort By:</label>
        <select id="sortOption">
          <option value="dueDate">Due Date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </section>

    <!-- Task List Container -->
    <ul id="taskList" class="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
